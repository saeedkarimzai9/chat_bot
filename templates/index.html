<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBot</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f7fb; min-height: 100vh; display: grid; place-items: center; }
    .chat { width: min(760px, 94vw); height: min(720px, 90vh); background: white; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 20px 24px; background: #111827; color: white; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; opacity: .75; font-size: 14px; }
    #messages { flex: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 11px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #eef2f7; color: #111827; border-bottom-left-radius: 4px; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #e5e7eb; }
    input { flex: 1; padding: 13px 15px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 16px; outline: none; }
    input:focus { border-color: #2563eb; }
    button { border: 0; border-radius: 12px; padding: 0 20px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <main class="chat">
    <header><h1>ChatBot</h1><p>Your simple AI assistant</p></header>
    <section id="messages" aria-live="polite">
      <div class="msg bot">Hello! I'm ChatBot. How can I help you?</div>
    </section>
    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="Type your message..." required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const messages = document.getElementById('messages');
    const send = document.getElementById('send');

    function addMessage(text, kind) {
      const el = document.createElement('div');
      el.className = `msg ${kind}`;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      input.focus();
      send.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        addMessage(data.reply || data.error || 'Something went wrong.', 'bot');
      } catch (error) {
        addMessage('Could not connect to the chatbot server.', 'bot');
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
