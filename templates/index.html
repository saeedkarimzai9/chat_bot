<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBot</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f7fb; min-height: 100vh; display: grid; place-items: center; }
    .chat { width: min(760px, 94vw); height: min(760px, 92vh); background: white; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 20px 24px; background: #111827; color: white; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; opacity: .75; font-size: 14px; }
    .key-box { padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
    .key-row { display: flex; gap: 8px; }
    #api-key { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; }
    #save-key, #clear-key { border: 0; border-radius: 10px; padding: 0 14px; font-weight: 600; cursor: pointer; }
    #save-key { background: #2563eb; color: white; }
    #clear-key { background: #e5e7eb; color: #111827; }
    .hint { margin: 7px 0 0; font-size: 12px; color: #6b7280; }
    #status { margin: 5px 0 0; font-size: 12px; color: #15803d; min-height: 16px; }
    #messages { flex: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 11px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #eef2f7; color: #111827; border-bottom-left-radius: 4px; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #e5e7eb; }
    #message { flex: 1; padding: 13px 15px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 16px; outline: none; }
    #message:focus, #api-key:focus { border-color: #2563eb; }
    #send { border: 0; border-radius: 12px; padding: 0 20px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 600px) { .key-row { flex-wrap: wrap; } #api-key { flex-basis: 100%; } .key-row button { min-height: 40px; } }
  </style>
</head>
<body>
  <main class="chat">
    <header><h1>ChatBot</h1><p>Your simple AI assistant</p></header>

    <section class="key-box">
      <div class="key-row">
        <input id="api-key" type="password" autocomplete="off" placeholder="Paste your OpenAI API key here...">
        <button id="save-key" type="button">Use Key</button>
        <button id="clear-key" type="button">Clear</button>
      </div>
      <p class="hint">Your key is kept only in this browser tab and is sent to this chatbot server when you send a message. Never put a real API key in GitHub.</p>
      <div id="status" aria-live="polite"></div>
    </section>

    <section id="messages" aria-live="polite">
      <div class="msg bot">Hello! I'm ChatBot. Paste your API key above, then send me a message.</div>
    </section>

    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="Type your message..." required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const apiKey = document.getElementById('api-key');
    const messages = document.getElementById('messages');
    const send = document.getElementById('send');
    const saveKey = document.getElementById('save-key');
    const clearKey = document.getElementById('clear-key');
    const status = document.getElementById('status');

    const savedKey = sessionStorage.getItem('chatbot_openai_key');
    if (savedKey) {
      apiKey.value = savedKey;
      status.textContent = 'API key is ready for this tab.';
    }

    saveKey.addEventListener('click', () => {
      const key = apiKey.value.trim();
      if (!key) {
        status.textContent = 'Please paste an API key first.';
        status.style.color = '#b91c1c';
        return;
      }
      sessionStorage.setItem('chatbot_openai_key', key);
      status.textContent = 'API key saved for this browser tab.';
      status.style.color = '#15803d';
    });

    clearKey.addEventListener('click', () => {
      apiKey.value = '';
      sessionStorage.removeItem('chatbot_openai_key');
      status.textContent = 'API key cleared.';
      status.style.color = '#6b7280';
    });

    function addMessage(text, kind) {
      const el = document.createElement('div');
      el.className = `msg ${kind}`;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      const key = apiKey.value.trim() || sessionStorage.getItem('chatbot_openai_key') || '';
      if (!message) return;
      if (!key) {
        addMessage('Please paste your OpenAI API key above first.', 'bot');
        apiKey.focus();
        return;
      }

      sessionStorage.setItem('chatbot_openai_key', key);
      addMessage(message, 'user');
      input.value = '';
      input.focus();
      send.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-OpenAI-API-Key': key
          },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        addMessage(data.reply || data.error || 'Something went wrong.', 'bot');
      } catch (error) {
        addMessage('Could not connect to the chatbot server.', 'bot');
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
