name: Run System 64 Discord Bot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discord-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Discord bot dependencies
        run: python -m pip install -r requirements-discord.txt

      - name: Start System 64 Discord bot
        run: python discord_bot.py
